<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Healthbridge: Health Connect sync server">
<title>Healthbridge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20108%20108'%3E%3Crect%20width='108'%20height='108'%20rx='24'%20fill='%23022236'/%3E%3Crect%20x='28'%20y='28'%20width='11'%20height='52'%20rx='2'%20fill='%23fff'/%3E%3Crect%20x='69'%20y='28'%20width='11'%20height='52'%20rx='2'%20fill='%23fff'/%3E%3Cpath%20d='M39%2056H46L51%2042L58%2070L63%2056H69'%20fill='none'%20stroke='%234FD1C5'%20stroke-width='6'%20stroke-linejoin='miter'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f9fb; --fg: #0f2530; --muted: #5d7380; --line: #dfe8ed; --card: #ffffff;
    --accent: #0b6e8a; --accent-fg: #ffffff; --glow: rgba(11,110,138,.10); --ok: #1a9e5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #041824; --fg: #e8f2f6; --muted: #86a1ae; --line: #16384a; --card: #082b3d;
      --accent: #4fd1c5; --accent-fg: #03222c; --glow: rgba(79,209,197,.10); --ok: #3ddc97;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: radial-gradient(900px 420px at 50% -120px, var(--glow), transparent), var(--bg);
    color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 96px 24px 32px; text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.75rem; letter-spacing: -.01em; margin: 20px 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; padding: 12px 22px; border-radius: 12px; font-weight: 600;
    text-decoration: none; border: 1px solid var(--line); color: var(--fg); background: var(--card);
    transition: transform .08s ease, border-color .15s ease;
  }
  .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .card {
    margin: 40px auto 0; padding: 16px 20px; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 0; }
  .row + .row { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }
  .label { color: var(--muted); font-size: .9rem; }
  .value { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.bad { background: #d1242f; }
  .note { margin: 14px 4px 0; color: var(--muted); font-size: .85rem; text-align: center; }
  footer { padding: 24px; text-align: center; color: var(--muted); font-size: .85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 108 108" role="img" aria-label="Healthbridge">
    <rect width="108" height="108" rx="24" fill="#022236"/>
    <rect x="28" y="28" width="11" height="52" rx="2" fill="#fff"/><rect x="69" y="28" width="11" height="52" rx="2" fill="#fff"/><path d="M39 56H46L51 42L58 70L63 56H69" fill="none" stroke="#4FD1C5" stroke-width="6" stroke-linejoin="miter"/>
  </svg>

  <h1>Healthbridge</h1>
  <p class="lead">Health Connect sync server</p>

  <div class="actions">
    <a class="btn primary" href="https://github.com/mteij/healthbridge/releases/latest">Get the app</a>
    <a class="btn" href="https://github.com/mteij/healthbridge#readme">Docs</a>
  </div>

  <div class="card" aria-live="polite">
    <div class="row"><span class="label">Server</span><span class="value"><span id="dot" class="dot"></span><span id="state">Checking…</span></span></div>
    <div class="row"><span class="label">Sign-ups</span><span class="value" id="signups">…</span></div>
  </div>
  <p class="note" id="note">Best-effort public instance, no uptime promises.</p>
</main>
<footer>Healthbridge <span id="version">{{ version }}</span> · <a href="https://github.com/mteij/healthbridge">GitHub</a></footer>
<script>
  var $ = function (id) { return document.getElementById(id); };
  fetch("/status").then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (s) {
    $("dot").className = "dot ok"; $("state").textContent = "Online";
    $("signups").textContent = !s.registration ? "Closed"
      : s.spots_left == null ? "Open" : "Open · " + s.spots_left + (s.spots_left === 1 ? " spot left" : " spots left");
    var note = "Best-effort public instance, no uptime promises.";
    if (s.inactive_days) note += " Accounts inactive for " + s.inactive_days + " days are deleted.";
    $("note").textContent = note;
  }).catch(function () {
    $("dot").className = "dot bad"; $("state").textContent = "Unreachable"; $("signups").textContent = "–";
  });
</script>
</body>
</html>
