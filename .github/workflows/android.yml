name: Android

on:
  push:
    branches: [main, app-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # optional: without these the APK is signed with a throwaway debug key
      HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
      HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
      HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"

      - name: Restore release keystore
        if: env.HB_KEYSTORE_B64 != ''
        run: |
          echo "$HB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/healthbridge.jks"
          echo "HB_KEYSTORE=$RUNNER_TEMP/healthbridge.jks" >> "$GITHUB_ENV"
          echo "HB_KEY_PASSWORD=$HB_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: healthbridge-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
