name: Android

on:
  push:
    branches: [main, app-rewrite, expressive, crashfix, stats, routeperm]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # optional: without these the APK is signed with a throwaway debug key
      HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
      HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
      HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo "$SDKM" --licenses > /dev/null || true
          sudo "$SDKM" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore release keystore
        if: env.HB_KEYSTORE_B64 != ''
        run: |
          printf '%s' "$HB_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/healthbridge.jks"
          ls -l "$RUNNER_TEMP/healthbridge.jks"
          echo "HB_KEYSTORE=$RUNNER_TEMP/healthbridge.jks" >> "$GITHUB_ENV"
          echo "HB_KEY_PASSWORD=$HB_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.1.${GITHUB_RUN_NUMBER}-dev"; fi
          gradle --no-daemon assembleRelease -PversionCode=${GITHUB_RUN_NUMBER} -PversionName="$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: healthbridge-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  # Starts the built APK on an emulator and prints the crash log, if any.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: healthbridge-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash .github/smoke.sh
